version: "3.9"

name: expenseflow-x

# ==============================================================================
# ExpenseFlow X - Full Stack Docker Compose
# ==============================================================================

networks:
  expenseflow-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  model_cache:
  receipt_uploads:

services:
  # ============================================================================
  # DATABASES
  # ============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: efx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenseflowx}
      POSTGRES_USER: ${POSTGRES_USER:-expenseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - expenseflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenseflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: efx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - expenseflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MICROSERVICES
  # ============================================================================

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: efx-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EXPENSE_SERVICE_URL=http://expense-service:8002
      - ANALYTICS_SERVICE_URL=http://analytics-service:8003
      - AI_SERVICE_URL=http://ai-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
      - ADMIN_SERVICE_URL=http://admin-service:8006
      - REDIS_URL=${REDIS_URL}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net
    volumes:
      - ./services/gateway-service:/app
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: efx-auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TOTP_SECRET_KEY=${TOTP_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net

  expense-service:
    build:
      context: ./services/expense-service
      dockerfile: Dockerfile
    container_name: efx-expense
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net
    volumes:
      - receipt_uploads:/app/uploads

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: efx-analytics
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expenseflow-net

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: efx-ai
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - FRAUD_THRESHOLD=${FRAUD_THRESHOLD:-0.85}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net
    volumes:
      - model_cache:/app/models/cache

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: efx-notification
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: efx-admin
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expenseflow-net

  # ============================================================================
  # CELERY WORKERS
  # ============================================================================

  celery-worker:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: efx-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q default,ai,analytics
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net
    volumes:
      - model_cache:/app/models/cache

  celery-beat:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: efx-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net

  celery-flower:
    image: mher/flower:2.0
    container_name: efx-flower
    restart: unless-stopped
    command: celery flower --broker=${CELERY_BROKER_URL} --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - expenseflow-net
      - monitoring-net

  # ============================================================================
  # ANALYTICS PORTAL (Streamlit)
  # ============================================================================

  analytics-portal:
    build:
      context: ./apps/analytics-portal
      dockerfile: Dockerfile
    container_name: efx-analytics-portal
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=${DATABASE_SYNC_URL}
      - REDIS_URL=${REDIS_URL}
      - AI_SERVICE_URL=http://ai-service:8004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expenseflow-net

  # ============================================================================
  # MONITORING
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: efx-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - monitoring-net
      - expenseflow-net

  grafana:
    image: grafana/grafana:latest
    container_name: efx-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # ============================================================================
  # LOGGING (ELK Stack)
  # ============================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: efx-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - monitoring-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: efx-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: efx-logstash
    restart: unless-stopped
    volumes:
      - ./infrastructure/docker/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - monitoring-net
      - expenseflow-net

  # ============================================================================
  # NGINX (Reverse Proxy)
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: efx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - gateway-service
    networks:
      - expenseflow-net
