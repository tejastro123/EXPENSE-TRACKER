global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── Self monitoring ──────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── API Gateway ──────────────────────────────────────────────
  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway-service:8000"]
    metrics_path: /metrics

  # ── Auth Service ─────────────────────────────────────────────
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8001"]
    metrics_path: /metrics

  # ── Expense Service ──────────────────────────────────────────
  - job_name: "expense-service"
    static_configs:
      - targets: ["expense-service:8002"]
    metrics_path: /metrics

  # ── Analytics Service ────────────────────────────────────────
  - job_name: "analytics-service"
    static_configs:
      - targets: ["analytics-service:8003"]
    metrics_path: /metrics

  # ── AI Service ───────────────────────────────────────────────
  - job_name: "ai-service"
    static_configs:
      - targets: ["ai-service:8004"]
    metrics_path: /metrics

  # ── Notification Service ─────────────────────────────────────
  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8005"]
    metrics_path: /metrics

  # ── Admin Service ────────────────────────────────────────────
  - job_name: "admin-service"
    static_configs:
      - targets: ["admin-service:8006"]
    metrics_path: /metrics

  # ── PostgreSQL ───────────────────────────────────────────────
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Redis ────────────────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Celery ──────────────────────────────────────────────────
  - job_name: "celery"
    static_configs:
      - targets: ["celery-worker:9191"]

  # ── Nginx ────────────────────────────────────────────────────
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
